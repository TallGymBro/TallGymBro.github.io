<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16191d">
<meta name="mobile-web-app-capable" content="yes">
<title>BlockPlan</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#16191d;--panel:#1f2328;--panel2:#272c33;--line:#343a42;--text:#e8eaed;--mut:#9aa3ad;--acc:#5fb85a;--acc2:#3d8b3a;--warn:#e0a03a;--bad:#e05a4f;--sel:#4fa3e0;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;user-select:text}
svg{width:22px;height:22px;display:block}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{padding-top:var(--st);background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px;height:calc(52px + var(--st));padding-left:4px;padding-right:6px;flex:none}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none}
.ib:active{background:var(--panel2)}
.ib:disabled{opacity:.3}
#pname{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:0 6px;height:44px;border-radius:12px;text-align:left}
#pname span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
#sync{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
#sync.ok{background:var(--acc)}#sync.pending{background:var(--warn)}#sync.err{background:var(--bad)}
#vt{display:flex;background:var(--panel2);border-radius:12px;padding:3px;flex:none}
#vt button{height:38px;padding:0 11px;border-radius:9px;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--mut)}
#vt button.on{background:var(--acc2);color:#fff}
#vt svg{width:18px;height:18px}
#view{position:relative;flex:1;min-height:0;overflow:hidden}
#c3,#c2{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#c2{background:#1a1e23}
#hud{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:flex-start}
.pill{background:rgba(22,25,29,.82);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums;backdrop-filter:blur(6px)}
.pill b{color:var(--text);font-weight:600}
#rail{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(31,35,40,.92);border:1px solid var(--line);border-radius:16px;padding:4px;backdrop-filter:blur(6px)}
#rail .ib{width:42px;height:42px}
#ly{font-size:12px;color:var(--mut);text-align:center;line-height:1.1;padding:2px 0;min-width:40px}
#ly b{display:block;font-size:17px;color:var(--text)}
#rail .ib.on{background:var(--sel);color:#fff}
#toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;background:#2d333b;border:1px solid var(--line);padding:9px 14px;border-radius:12px;font-size:13.5px;pointer-events:none;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#ctx{background:var(--panel);border-top:1px solid var(--line);padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:48px;flex:none}
#ctx:empty{display:none}
.hint{color:var(--mut);font-size:13.5px;flex:1 1 100%}
.hint b{color:var(--text)}
.btn{height:40px;padding:0 13px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:550;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.dan{color:#ffb3ad}
.btn:active{filter:brightness(1.25)}
.btn:disabled{opacity:.35}
.step{display:inline-flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:11px;height:40px}
.step button{width:38px;height:38px;display:grid;place-items:center}
.step span{min-width:58px;text-align:center;font-size:13.5px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:2px;height:40px}
.seg button{padding:0 11px;border-radius:9px;font-size:13.5px;color:var(--mut)}
.seg button.on{background:#3a414a;color:var(--text)}
.grow{flex:1}
.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,40px);gap:4px}
.pad button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-size:12px;font-weight:700;display:grid;place-items:center}
.pad button:active{background:#3a414a}
#bottom{background:var(--panel);border-top:1px solid var(--line);padding-bottom:var(--sb);flex:none}
#blocks{display:flex;align-items:center;gap:6px;padding:7px 8px 3px;overflow-x:auto;scrollbar-width:none}
#blocks::-webkit-scrollbar,#tools::-webkit-scrollbar{display:none}
.sw{display:block;width:38px;height:38px;border-radius:9px;flex:none;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),inset 0 -6px 0 rgba(0,0,0,.18)}
.sw.on{border-color:#fff}
#curb{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;flex:none;max-width:52%}
#curb .sw{width:36px;height:36px}
#curb span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tools{display:flex;gap:2px;padding:3px 6px 6px;overflow-x:auto;scrollbar-width:none}
.tool{flex:none;width:58px;height:54px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mut);font-size:10.5px}
.tool.on{background:var(--acc2);color:#fff}
.glass{background-image:linear-gradient(135deg,rgba(255,255,255,.45) 0 18%,transparent 18% 100%)}
/* feuilles */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .18s;z-index:10}
#scrim.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:86%;background:var(--panel);border-radius:18px 18px 0 0;border-top:1px solid var(--line);z-index:11;transform:translateY(105%);transition:transform .22s ease;display:flex;flex-direction:column;padding-bottom:var(--sb)}
#sheet.show{transform:none}
.sh-h{display:flex;align-items:center;gap:8px;padding:12px 10px 8px 16px;flex:none}
.sh-h h2{margin:0;font-size:17px;flex:1}
.sh-b{overflow-y:auto;padding:4px 14px 16px;flex:1;-webkit-overflow-scrolling:touch}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips button{flex:none;height:34px;padding:0 12px;border-radius:17px;background:var(--panel2);border:1px solid var(--line);font-size:13px;color:var(--mut)}
.chips button.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.bcell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:12px;font-size:11px;text-align:center;color:var(--mut);line-height:1.15}
.bcell .sw{width:44px;height:44px}
.bcell.on{background:var(--panel2);color:var(--text)}
.row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .m{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--mut)}
.row.cur .t{color:var(--acc)}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:16px 4px 6px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.field{margin:8px 0}
.field label{display:block;font-size:12.5px;color:var(--mut);margin:0 2px 4px}
.mat{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line)}
.mat .sw{width:30px;height:30px}
.mat .n{flex:1;min-width:0}
.mat .c{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.mat .c small{display:block;color:var(--mut);font-size:11.5px}
p.note{color:var(--mut);font-size:13.5px;margin:6px 2px}
.help li{margin:6px 0;color:var(--mut)}.help b{color:var(--text)}

.orow{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 100%}
.orow .seg button{padding:0 9px}
.zgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1 1 100%}
.zgrid .step{width:100%;justify-content:space-between}
.zgrid .step span{min-width:0;flex:1}
.thumb{width:52px;height:40px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tog{display:flex;align-items:center;gap:10px;padding:10px 2px;color:var(--text)}
.tog input{width:20px;height:20px;accent-color:var(--acc)}
input[type=range]{padding:0;accent-color:var(--acc);height:28px;background:none;border:0}
.sw.sh-stairs{clip-path:polygon(0 0,50% 0,50% 50%,100% 50%,100% 100%,0 100%)}
.sw.sh-slab{clip-path:polygon(0 50%,100% 50%,100% 100%,0 100%)}
.sw.sh-wall{clip-path:polygon(25% 0,75% 0,75% 30%,100% 30%,100% 100%,0 100%,0 30%,25% 30%)}
.sw.sh-trapdoor{clip-path:polygon(0 72%,100% 72%,100% 100%,0 100%)}
#recents button{flex:none;display:block}
/* mise en page en grille (portrait) */
#app{display:grid;grid-template-columns:100%;grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "view" "ctx" "bottom"}
#top{grid-area:top}#view{grid-area:view}#ctx{grid-area:ctx}#bottom{grid-area:bottom}
#bFS{display:none}
/* paysage : outils à gauche, vue maximale */
@media (orientation:landscape) and (max-height:620px){
  #app{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"side top" "side view" "side ctx"}
  #bottom{grid-area:side;display:flex;flex-direction:row;border-top:0;border-right:1px solid var(--line);padding:0 0 0 env(safe-area-inset-left,0px);min-height:0}
  #blocks{flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:6px 4px;width:52px}
  #recents{flex-direction:column}
  #curb{padding:3px;max-width:none}#curb span{display:none}
  #tools{flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:6px 4px;width:66px}
  .tool{width:58px;height:50px}
  #top{height:46px;padding-top:0;padding-right:calc(6px + env(safe-area-inset-right,0px))}
  #top .ib{width:40px;height:40px}
  #vt button{height:34px}
  #bFS{display:grid}
  #ctx{max-height:42vh;overflow-y:auto;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));padding-right:calc(10px + env(safe-area-inset-right,0px))}
  .hint{flex:1 1 auto}
  #rail{right:calc(8px + env(safe-area-inset-right,0px))}
  #rail .ib{width:38px;height:38px}
  #sheet{left:auto;width:min(560px,100%);max-height:100%;border-radius:18px 0 0 0}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="ib" id="bMenu" aria-label="Projets"></button>
    <button id="pname"><i id="sync"></i><span>…</span></button>
    <button class="ib" id="bUndo" aria-label="Annuler"></button>
    <button class="ib" id="bRedo" aria-label="Rétablir"></button>
    <button class="ib" id="bFS" aria-label="Plein écran"></button>
    <div id="vt"><button data-v="3d" class="on"></button><button data-v="2d"></button></div>
  </div>
  <div id="view">
    <canvas id="c3"></canvas>
    <canvas id="c2" hidden></canvas>
    <div id="hud"><div class="pill" id="coord">—</div><div class="pill" id="info" hidden></div></div>
    <div id="rail">
      <button class="ib" id="bLyUp" aria-label="Couche +1"></button>
      <div id="ly">Y<b>0</b></div>
      <button class="ib" id="bLyDn" aria-label="Couche -1"></button>
      <button class="ib" id="bClip" aria-label="Couper au-dessus"></button>
      <button class="ib" id="bFit" aria-label="Recentrer"></button>
      <button class="ib" id="bZone" aria-label="Zone de build"></button>
    </div>
    <div id="toast"></div>
  </div>
  <div id="ctx"></div>
  <div id="bottom">
    <div id="blocks"><button id="curb"><i class="sw"></i><span></span></button><div id="recents" style="display:flex;gap:6px"></div></div>
    <div id="tools"></div>
  </div>
</div>
<div id="scrim"></div>
<div id="sheet"><div class="sh-h"><h2></h2><button class="ib" id="shX" aria-label="Fermer"></button></div><div class="sh-b"></div></div>
<input type="file" id="imgfile" accept="image/*" hidden>
<input type="file" id="file" accept=".json,.litematic,application/json,application/octet-stream" hidden>
